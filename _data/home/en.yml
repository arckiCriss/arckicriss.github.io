research:
  label: Research
  title: Systems and network security
  introduction: I study the security and reliability of networked systems. Much of my work has examined mobile and wireless systems, using measurements from phones and operational cellular networks to understand how deployed services behave.
  current_label: Current work
  current: I’m exploring how AI can help researchers analyze complex systems, including the relationship between a protocol specification and its implementation.
