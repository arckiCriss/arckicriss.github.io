projects:
  heading: Research projects
  items:
    - title: Cellular emergency services
      detail: As the student lead on an NSF SaTC project on next-generation 911, I helped investigate how emergency calls are handled in operational mobile networks.
    - title: Cellular IoT services
      detail: In an NSF NeTS project, my collaborators and I studied how operators secure the mobile network infrastructure shared by IoT devices and smartphones.
    - title: AI for systems security
      detail: I am exploring how language models can help compare protocol specifications with implementations and identify security assumptions that warrant closer examination.
