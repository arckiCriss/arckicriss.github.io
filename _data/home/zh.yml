projects:
  heading: 研究项目
  items:
    - title: 蜂窝网络紧急呼叫
      detail: 博士期间，我在美国国家科学基金会（NSF）SaTC 下一代 911 项目中担任学生负责人，参与研究商用移动网络处理紧急呼叫时的安全问题。
    - title: 蜂窝物联网服务
      detail: 我与合作者在 NSF NeTS 项目中研究了物联网设备和智能手机共享蜂窝基础设施时，运营商如何保障接入和服务安全。
    - title: 人工智能与系统安全
      detail: 我正在探索如何利用语言模型比对协议规范与实际实现，找出需要进一步验证的安全假设。
