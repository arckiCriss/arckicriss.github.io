research:
  label: 研究方向
  title: 系统与网络安全
  introduction: 我研究网络化系统的安全性与可靠性。过去的工作主要关注移动与无线系统，通过对手机终端和商用蜂窝网络的实测，分析实际部署中的安全问题。
  current_label: 近期工作
  current: 我也在探索如何借助人工智能分析复杂系统的安全性，例如对照协议规范与系统实现，理解两者在实际运行中的差异。
